name: LaTeX build

# Checks every citation against bib/references.bib and builds LaTeX sources
# and PDFs for the three papers, the long version and Case Study 1.
# PDFs are uploaded as a workflow artifact; on a version tag (v*) they are
# also attached to a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pandoc, LuaLaTeX and biber
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            pandoc latexmk biber \
            texlive-luatex texlive-latex-recommended texlive-latex-extra \
            texlive-bibtex-extra texlive-fonts-recommended lmodern fonts-dejavu

      - name: Check citations against the bibliography
        run: python3 tools/build_papers.py check

      - name: Build LaTeX and PDF
        run: python3 tools/build_papers.py build --pdf

      - name: Upload PDFs, LaTeX sources and per-paper bibliographies
        uses: actions/upload-artifact@v4
        with:
          name: papers-${{ github.sha }}
          path: |
            build/pdf/*.pdf
            build/*/*.tex
            build/*/*.bib
          if-no-files-found: error

      - name: Attach PDFs to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Draft papers built from $GITHUB_REF_NAME. Not peer reviewed, not empirically validated."
          gh release upload "$GITHUB_REF_NAME" build/pdf/*.pdf --clobber
